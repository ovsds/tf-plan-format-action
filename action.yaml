name: "TF Plan Format"
description: |
  Render Terraform/OpenTofu plans into GitHub markdown with tf-plan-format

# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#branding
branding:
  icon: "file-text"
  color: "gray-dark"

inputs:
  plan-files:
    description: |
      Plan JSON paths or globs (the output of `show -json`), separated by `plan-files-separator`
    required: true

  plan-files-separator:
    description: |
      Separator to split plan files
    required: true
    default: "\n"

  version:
    description: |
      tf-plan-format version, a release tag from 0.2.0 on
    required: true
    default: "0.3.0"

outputs:
  rendered-plan:
    description: |
      Rendered plan in GitHub markdown
    value: ${{ steps.run.outputs.rendered-plan }}

  rendered-plan-path:
    description: |
      Path of a file in `$RUNNER_TEMP` holding the rendered plan
    value: ${{ steps.run.outputs.rendered-plan-path }}

runs:
  using: "composite"
  steps:
    - name: Run
      id: run
      shell: bash
      env:
        INPUT_PLAN_FILES: ${{ inputs.plan-files }}
        INPUT_PLAN_FILES_SEPARATOR: ${{ inputs.plan-files-separator }}
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        # TF Plan Format
        "${GITHUB_ACTION_PATH}/src/main.sh"
