name: "TF Plan Format"
description: |
  Render Terraform/OpenTofu plans into GitHub markdown with tf-plan-format

# https://docs.github.com/en/actions/creating-actions/metadata-syntax-for-github-actions#branding
branding:
  icon: "file-text"
  color: "gray-dark"

inputs:
  plan-files:
    description: |
      Plan JSON paths or globs (the output of `show -json`), separated by `plan-files-separator`
    required: true

  plan-files-separator:
    description: |
      Separator to split plan files
    required: true
    default: "\n"

  version:
    description: |
      tf-plan-format version, a release tag like 0.1.0
    required: true
    default: "0.1.0"

  rendered-plan-path:
    description: |
      Path to write the rendered plan to instead of the `rendered-plan` output
    required: false

outputs:
  rendered-plan:
    description: |
      Rendered plan in GitHub markdown, empty when `rendered-plan-path` is set
    value: ${{ steps.run.outputs.rendered-plan }}

runs:
  using: "composite"
  steps:
    - name: Run
      id: run
      shell: bash
      env:
        INPUT_PLAN_FILES: ${{ inputs.plan-files }}
        INPUT_PLAN_FILES_SEPARATOR: ${{ inputs.plan-files-separator }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_RENDERED_PLAN_PATH: ${{ inputs.rendered-plan-path }}
      run: |
        # TF Plan Format
        "${GITHUB_ACTION_PATH}/src/main.sh"
